spring.application.name=summerwiki-api

# 1. Database Connection (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/summerwiki
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. JPA / Hibernate Settings
# 프로젝트 실행 시 엔티티를 분석해 테이블을 자동으로 생성/수정해줍니다.
spring.jpa.hibernate.ddl-auto=update
# 콘솔에 실행되는 SQL문을 예쁘게 출력해줍니다.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# PostgreSQL 전용 문법(Dialect) 사용 설정
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect